name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate repository bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY##*/}"
          test -s LICENSE
          test -s README.md
          test -s docs/README.md
          grep -F "https://github.com/VibeTGram/${repo}" README.md
          grep -F '| Document | Owning repository |' docs/README.md
          git diff --check
